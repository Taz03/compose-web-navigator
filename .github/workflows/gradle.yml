name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.konan
          key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'oracle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Library and Plugin
        run: ./gradlew build

      - name: Publish to MavenLocal
        run: ./gradlew publishToMavenLocal -Punsigned

      - name: Build Demo
        run: ./gradlew :demo:build
